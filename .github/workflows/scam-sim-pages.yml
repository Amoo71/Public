name: Deploy SCAM SIM to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'scam-sim/**'
      - '.github/workflows/scam-sim-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scam-sim-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload SCAM SIM
        uses: actions/upload-pages-artifact@v3
        with:
          path: './scam-sim'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
